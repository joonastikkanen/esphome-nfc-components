# Native ESPHome entities only: no MQTT or Home Assistant action calls.
sensor:
  - platform: template
    name: Water Temperature
    id: meter_temperature
    unit_of_measurement: °C
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never
  - <<: &volume_sensor
      platform: template
      unit_of_measurement: m³
      device_class: water
      accuracy_decimals: 3
      update_interval: never
    name: Forward Water Volume
    id: meter_forward_volume
    state_class: total_increasing
  - <<: *volume_sensor
    name: Reverse Water Volume
    id: meter_reverse_volume
    # The meter reports a signed negative cumulative reverse volume.
    state_class: total
  - <<: *volume_sensor
    name: Key Date Water Volume
    id: meter_key_volume
    state_class: measurement
  - platform: template
    name: History Count
    id: meter_history_count
    accuracy_decimals: 0
    update_interval: never

  # Slots follow the meter's newest-to-oldest order. Each has a date entity.
  # Use Water Volume, not these rolling snapshots, for Energy consumption.
  - <<: &history_volume_sensor
      <<: *volume_sensor
      state_class: measurement
    name: History 01 Volume
    id: history_volume_01
  - <<: *history_volume_sensor
    name: History 02 Volume
    id: history_volume_02
