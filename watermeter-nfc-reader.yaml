esphome:
  name: watermeter-nfc-reader
  friendly_name: Watermeter NFC Reader
  includes:
    - watermeter_parser.h
  on_boot:
    priority: -100
    then:
      - lambda: |-
          // Template numbers restore their state during setup, before this runs.
          id(i_pn532).set_update_interval(static_cast<uint32_t>(id(nfc_read_interval).state * 1000.0f));
          id(i_pn532).stop_poller();
          id(i_pn532).start_poller();

packages:
  native_meter_entities: !include watermeter_entities.yaml

# One source only. Copy components/ alongside this YAML in ESPHome's config folder.
external_components:
  - source:
      type: local
      path: components
    components: [nfc, pn532_i2c, pn532]

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

api:
  encryption:
    key: !secret watermeter_api_key

ota:
  - platform: esphome
    password: !secret watermeter_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Watermeter-Nfc-Reader
    password: !secret watermeter_ap_password

captive_portal:
web_server:
  include_internal: true

logger:
  level: DEBUG
  tx_buffer_size: 2048

i2c:
  id: bus_a
  sda: GPIO6
  scl: GPIO7
  scan: true

time:
  - platform: sntp
    id: sntp_time
    servers:
      - 0.fi.pool.ntp.org
      - 1.fi.pool.ntp.org
      - 2.fi.pool.ntp.org

debug:
  update_interval: 30s

button:
  - platform: restart
    name: Restart
  - platform: template
    name: Read Water Meter NFC
    icon: mdi:nfc-search-variant
    on_press:
      - component.update: i_pn532

number:
  - platform: template
    name: NFC Read Interval
    id: nfc_read_interval
    icon: mdi:timer-cog-outline
    entity_category: config
    unit_of_measurement: s
    min_value: 10
    max_value: 3600
    step: 5
    initial_value: 30
    optimistic: true
    restore_value: true
    mode: box
    set_action:
      - lambda: |-
          id(i_pn532).set_update_interval(static_cast<uint32_t>(x * 1000.0f));
          id(i_pn532).stop_poller();
          id(i_pn532).start_poller();

sensor:
  - platform: uptime
    name: Uptime
  - platform: wifi_signal
    name: Device WiFi Signal dB
    id: wifi_signal_db
    update_interval: 60s
    entity_category: diagnostic
  - platform: copy
    source_id: wifi_signal_db
    name: Device WiFi Signal Percent
    filters:
      - lambda: return min(max(2 * (x + 100.0f), 0.0f), 100.0f);
    unit_of_measurement: Signal %
    entity_category: diagnostic
    device_class: ""
  - platform: template
    name: Water Volume
    id: water_volume
    unit_of_measurement: m³
    device_class: water
    state_class: total_increasing
    accuracy_decimals: 3
    icon: mdi:water
    update_interval: never

text_sensor:
  - platform: debug
    reset_reason:
      name: Reset Reason
  # HA entity states are limited to 255 characters. Keep this a compact summary.
  - platform: template
    name: Water Meter NFC Data
    id: water_meter_json
    icon: mdi:water
    update_interval: never
  # Full data remains on the device/web server, not in an oversized HA state.
  - platform: template
    name: Water Meter NFC Full JSON
    id: water_meter_full_json
    internal: true
    update_interval: never
  - platform: template
    name: Water Meter NFC Raw Text
    id: water_meter_raw
    internal: true
    update_interval: never

pn532_i2c:
  id: i_pn532
  i2c_id: bus_a
  update_interval: 30s
  read_same_tag: true
  on_tag:
    then:
      - lambda: |-
          if (!tag.has_ndef_message()) {
            ESP_LOGW("watermeter", "Tag %s has no complete NDEF message", x.c_str());
            return;
          }
          std::string input;
          for (const auto &record : tag.get_ndef_message()->get_records()) {
            if (record->get_type() != "T")
              continue;
            if (!input.empty()) input += '\n';
            input += record->get_payload();
          }
          if (input.empty()) {
            ESP_LOGW("watermeter", "No supported text records");
            return;
          }
          id(water_meter_raw).publish_state(input);
          ESP_LOGD("watermeter", "Decoded NFC text (%u bytes): %s", unsigned(input.size()), input.c_str());
          auto reading = watermeter::parse(input);
          float volume;
          if (reading.get("S/N").empty() || !reading.volume(volume)) {
            ESP_LOGW("watermeter", "Missing serial or invalid volume; retaining last good reading");
            return;
          }
          const auto full = reading.json(x, tag.get_tag_type(), true, false);
          const auto summary = reading.json(x, tag.get_tag_type(), false);
          id(water_meter_full_json).publish_state(full);
          if (summary.size() <= 255)
            id(water_meter_json).publish_state(summary);
          else
            ESP_LOGW("watermeter", "Summary exceeds HA state limit; see full JSON on device");
          id(water_volume).publish_state(volume);
          auto publish_number = [](sensor::Sensor *entity, const std::string &text,
                                   const std::string &unit, bool allow_negative = false) {
            float value;
            entity->publish_state(watermeter::parse_quantity(text, unit, value, allow_negative) ? value : NAN);
          };
          publish_number(id(meter_temperature), reading.get("Temp"), "°C", true);
          publish_number(id(meter_forward_volume), reading.get("FVol"), "m³");
          publish_number(id(meter_reverse_volume), reading.get("RVol"), "m³", true);
          publish_number(id(meter_key_volume), reading.get("KVol"), "m³");
          id(meter_history_count).publish_state(reading.history.size());
          id(meter_name).publish_state(reading.name);
          id(meter_serial).publish_state(reading.get("S/N"));
          id(meter_nfc_uid).publish_state(x);
          id(meter_nfc_type).publish_state(tag.get_tag_type());
          id(meter_time).publish_state(reading.get("Time"));
          id(meter_key_date).publish_state(reading.get("KDate"));
          id(meter_battery).publish_state(reading.get("Battery"));
          id(meter_firmware).publish_state(reading.get("FW"));
          id(meter_crc).publish_state(reading.get("CRC"));
          sensor::Sensor *history_volumes[] = {
            id(history_volume_01), id(history_volume_02), id(history_volume_03), id(history_volume_04),
            id(history_volume_05), id(history_volume_06), id(history_volume_07), id(history_volume_08),
            id(history_volume_09), id(history_volume_10), id(history_volume_11), id(history_volume_12),
            id(history_volume_13), id(history_volume_14), id(history_volume_15), id(history_volume_16),
            id(history_volume_17), id(history_volume_18), id(history_volume_19), id(history_volume_20),
            id(history_volume_21), id(history_volume_22), id(history_volume_23), id(history_volume_24),
            id(history_volume_25), id(history_volume_26), id(history_volume_27), id(history_volume_28)
          };
          text_sensor::TextSensor *history_dates[] = {
            id(history_date_01), id(history_date_02), id(history_date_03), id(history_date_04),
            id(history_date_05), id(history_date_06), id(history_date_07), id(history_date_08),
            id(history_date_09), id(history_date_10), id(history_date_11), id(history_date_12),
            id(history_date_13), id(history_date_14), id(history_date_15), id(history_date_16),
            id(history_date_17), id(history_date_18), id(history_date_19), id(history_date_20),
            id(history_date_21), id(history_date_22), id(history_date_23), id(history_date_24),
            id(history_date_25), id(history_date_26), id(history_date_27), id(history_date_28)
          };
          for (size_t i = 0; i < 28; ++i) {
            if (i < reading.history.size()) {
              history_dates[i]->publish_state(reading.history[i].first);
              publish_number(history_volumes[i], reading.history[i].second, "m³");
            } else {
              history_dates[i]->publish_state("");
              history_volumes[i]->publish_state(NAN);
            }
          }
          ESP_LOGI("watermeter", "Read %.3f m³, %u history entries", volume, unsigned(reading.history.size()));
